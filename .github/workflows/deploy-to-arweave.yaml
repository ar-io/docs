name: Deploy to Arweave (Production)

on:
  workflow_dispatch:
    inputs:
      undername:
        description: "ArNS undername for deployment (use @ for base name)"
        required: true
        type: string

# One deploy at a time: two concurrent runs would race both the ArNS update
# and the dedupe-cache commit.
concurrency:
  group: deploy-to-arweave
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run linter
        run: yarn lint

  deploy:
    runs-on: ubuntu-latest
    needs: lint

    # Only this job writes: the persist step below commits the dedupe cache.
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Next.js application
        run: yarn build

      # Durable backstop beneath the action's own Actions-cache copy (see the
      # Persist step below for why that alone isn't enough). A miss here just
      # means the deploy falls back to the action's cache, or a full upload —
      # never fails the job.
      - name: Restore dedupe cache
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p .ario-deploy
          git fetch origin deploy-cache 2>/dev/null || exit 0
          git show origin/deploy-cache:transaction-cache.json \
            > .ario-deploy/transaction-cache.json 2>/dev/null || \
            rm -f .ario-deploy/transaction-cache.json

      - name: Deploy to Arweave
        uses: ar-io/ar-io-deploy@v1
        with:
          deploy-key: ${{ secrets.DEPLOY_KEY }}
          arns-key: ${{ secrets.ARNS_KEY }}
          arns-name: ${{ secrets.ARNS_NAME }}
          undername: "${{ inputs.undername }}"
          deploy-folder: ./out

      # ar-io-deploy records which files it has already uploaded, and skips
      # re-uploading (and re-paying for) them next time. It keeps that record
      # in the Actions cache under a fixed key, but GitHub evicts caches unused
      # for 7 days -- and deploys here are manual and infrequent, so the cache
      # regularly goes cold between them.
      #
      # This used to commit the file straight onto `main`, but `main` requires
      # PRs for every change -- including this workflow's own push -- so that
      # push was rejected on every single run (silently: `continue-on-error`
      # means the job still reported green). Instead of fighting the branch
      # protection, this persists to its own unprotected `deploy-cache` branch
      # via a worktree, so `main`'s history never carries deploy bookkeeping.
      #
      # `continue-on-error` and `if: always()` are deliberate: this is a cost
      # optimisation and must never turn a successful deploy into a failed run.
      - name: Persist dedupe cache
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail

          if [ ! -f .ario-deploy/transaction-cache.json ]; then
            echo "No transaction cache produced; nothing to persist."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin deploy-cache 2>/dev/null || true

          worktree_dir="$(mktemp -d)"
          if git rev-parse --verify -q origin/deploy-cache >/dev/null; then
            git worktree add "$worktree_dir" origin/deploy-cache --detach
          else
            # `git worktree add --orphan` needs git 2.42+; build the orphan
            # branch by hand instead of assuming the runner is that new. The
            # empty-tree SHA is a git constant, not this repo's -- always
            # 4b825dc642cb6eb9a060e54bf8d69288fbee4904.
            empty_commit=$(git commit-tree 4b825dc642cb6eb9a060e54bf8d69288fbee4904 \
              -m "init deploy-cache" < /dev/null)
            git worktree add -b deploy-cache "$worktree_dir" "$empty_commit"
          fi

          cp .ario-deploy/transaction-cache.json "$worktree_dir/transaction-cache.json"

          cd "$worktree_dir"
          if [ -z "$(git status --porcelain -- transaction-cache.json)" ]; then
            echo "Dedupe cache unchanged."
            exit 0
          fi
          git add transaction-cache.json
          git commit -m "chore(deploy): update dedupe cache [skip ci]"
          git push origin HEAD:refs/heads/deploy-cache
